<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>localStorage</title>
</head>
<body>

<p id="myDog"></p>

<script>
  //save the data as a key value pair locally in the browser
  localStorage.setItem("Name", "Dax");

  //use the key "Name" to get its value back and show it on the page
  document.getElementById("myDog").innerHTML = localStorage.getItem("Name");
</script>

</body>
</html>
