<!DOCTYPE html>
<html>
<head>
<!-- link to the google api jquery file -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jquery.min.js"></script>
</head>
<script>
//wait until the document is loaded before running the jquery
$(document).ready(function () {

//add the content into the html element
$("html").append(
"<body>\
<div id='container'>\
<div id='inner'>\
<h1>Basic jQuery</h1>\
<p id='1'>Paragraph 1</p>\
<p id='2'>Paragraph 2</p>\
<p id='3'>Paragraph 3</p>\
</div>\
</div>\
</body>"
);

//use jquery to make paragraph 2 red
$("#2").css({"color": "red"});

//when paragraph 3 is clicked hide the h1
$("#3").click(function () {
$("h1").hide();
});

});
</script>
</html>
