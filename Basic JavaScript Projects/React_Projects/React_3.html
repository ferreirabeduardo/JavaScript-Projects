<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>React 3 - JSX</title>
    <!-- link to the react libraries and the babel (JSX) library via URL -->
    <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>

    <!-- the div where our JSX will render -->
    <div id="JSX"></div>

    <!-- type must be text/babel so the browser can read the JSX -->
    <script type="text/babel">
      //a class component that returns JSX
      class Greeting extends React.Component {
        render() {
          return <h1>Hello, world!</h1>
        }
      }

      //render the Greeting component into the JSX div
      ReactDOM.render(<Greeting />, document.getElementById('JSX'));
    </script>

  </body>
</html>
